# Downloads season stats, rosters and the schedule from GitHub's servers and commits them to
# data/seed/, for hosts (like Railway) that Basketball-Reference blocks. Runs daily during the
# season, whenever this file changes, and on demand from the Actions tab ("Run workflow").
name: Fetch data

on:
  schedule:
    - cron: "17 10 * * *"  # daily, 10:17 UTC (early morning US time, after the night's games)
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/fetch-data.yml"]

permissions:
  contents: write

concurrency:
  group: fetch-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests lxml
      - name: Download stats into data/seed
        env:
          FANTASY_RAW_DIR: data/seed
        # Past seasons are cached in data/seed, so later runs only re-fetch the current season,
        # rosters and schedule.
        run: |
          python -m app.cli fetch
          # The backtest (projecting 2025-26) also needs 2022-23.
          python -c "from app.scrape import fetch_seasons; fetch_seasons([2023])"
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add data/seed
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update stats data ($(date -u +%F))"
            git pull --rebase origin main
            git push
          fi
